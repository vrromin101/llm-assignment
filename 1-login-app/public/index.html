<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login / Register</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f1f5f9;display:flex;justify-content:center;padding:40px}
  .card{background:#fff;padding:24px;border-radius:12px;width:320px;box-shadow:0 2px 10px #0002}
  input,button{width:100%;padding:10px;margin:6px 0;box-sizing:border-box}
  button{background:#2563eb;color:#fff;border:0;border-radius:6px;cursor:pointer}
  a{color:#2563eb;cursor:pointer} #msg{color:#b91c1c;min-height:20px}
</style>
</head>
<body>
<div class="card">
  <h2 id="title">Login</h2>
  <div id="form">
    <input id="name" placeholder="Name" style="display:none">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="submitForm()" id="btn">Login</button>
    <p><a onclick="toggle()" id="toggle">New user? Register</a></p>
  </div>
  <div id="welcome" style="display:none">
    <h3 id="hello"></h3>
    <button onclick="logout()">Logout</button>
  </div>
  <div id="msg"></div>
</div>
<script>
let isLogin = true;
const $ = id => document.getElementById(id);
function toggle(){
  isLogin = !isLogin;
  $('name').style.display = isLogin ? 'none' : 'block';
  $('title').textContent = $('btn').textContent = isLogin ? 'Login' : 'Register';
  $('toggle').textContent = isLogin ? 'New user? Register' : 'Have an account? Login';
  $('msg').textContent = '';
}
async function submitForm(){
  const body = { name:$('name').value, email:$('email').value, password:$('password').value };
  const r = await fetch(isLogin ? '/api/login' : '/api/register', {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const d = await r.json();
  $('msg').style.color = r.ok ? '#15803d' : '#b91c1c';
  $('msg').textContent = d.message || d.error;
  if(r.ok && isLogin) showWelcome(d.user);
  else if(r.ok) toggle();
}
function showWelcome(u){
  $('form').style.display='none'; $('welcome').style.display='block';
  $('title').textContent='Dashboard'; $('hello').textContent='Welcome, '+u.name+'!';
}
async function logout(){
  await fetch('/api/logout',{method:'POST'}); location.reload();
}
fetch('/api/me').then(r=>r.ok?r.json():null).then(u=>u&&showWelcome(u));
</script>
</body>
</html>
